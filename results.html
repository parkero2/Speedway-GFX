<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Race Results - Motorsport Graphics</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="./spx_interface.js"></script>
    <script>
        window.SPXGCTemplateDefinition = {
            description: "Race Results",
            playserver: "OVERLAY",
            playchannel: "1",
            playlayer: "12",
            webplayout: "12",
            out: "manual",
            dataformat: "json",
            uicolor: "6",
        }
        /**
         * SPX COMPANION FUNCTION CALLS
         * 
         * Available companion functions (call these from SPX or console):
         * - toggleResults()                        // show/hide results
         * - showResults()                          // show results with animation
         * - hideResults()                          // hide results
         * - loadResultsFromTiming()                // reload results data from timing_data.txt
         * - toggleScroll()                         // scroll between top/bottom if needed
         *
         * Keyboard shortcuts:
         * - SPACE = Toggle Results
         * - ESC = Hide Results
         * - R = Reload Timing Data
         * - S = Toggle Scroll (if more than 15 rows)
         *
         * Example usages:
         *   showResults();
         *   hideResults();
         *   loadResultsFromTiming();
         */
    </script>
</head>
<body>
    <div id="overlay" class="overlay">
        <!-- Results Component -->
        <div id="results" class="results">
            <div class="results-panel">
                <!-- Header -->
                <div class="results-header">
                    <div class="results-logo">
                        <img src="assets/logo.svg" alt="Logo" class="header-logo">
                    </div>
                    <div class="results-title">
                        <span id="raceTitle">RACE RESULTS</span>
                    </div>
                    <div class="results-info">
                        <span id="raceInfo"></span>
                    </div>
                </div>

                <!-- Column Headers -->
                <div class="results-columns">
                    <div class="results-column-header pos-col">POS</div>
                    <div class="results-column-header number-col">#</div>
                    <div class="results-column-header driver-col">DRIVER</div>
                    <div class="results-column-header gap-col">GAP</div>
                </div>

                <!-- Results Rows -->
                <div class="results-rows" id="resultsRows">
                    <!-- Rows will be generated by JavaScript -->
                </div>

                <!-- Hashtag Line -->
                <div class="results-hashtag-line" id="resultsHashtagLine">
                    <span id="resultsHashtag">#Loading</span>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Results Component Styles */
        .results {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 65vw;
            max-width: 1300px;
            min-width: 900px;
            z-index: 130;
            opacity: 0;
            transition: all 400ms cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .results.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .results-panel {
            background: var(--bg-900);
            border: 1px solid var(--line);
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            /* Diagonal cutouts - swapped corners */
            clip-path: polygon(
                0% 0%, 
                calc(100% - 20px) 0%, 
                100% 20px, 
                100% 100%, 
                20px 100%, 
                0% calc(100% - 20px)
            );
        }

        .results-header {
            background: var(--bg-700);
            padding: 24px 32px;
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            align-items: center;
            gap: 24px;
        }

        .results-logo {
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 72px;
            width: auto;
        }

        .results-title {
            font-weight: 800;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-hi);
            text-align: center;
        }

        .results-info {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-hi);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .results-columns {
            display: grid;
            grid-template-columns: 0.8fr 0.8fr 5.5fr 1.2fr;
            background: var(--bg-800);
            border-bottom: 2px solid var(--line);
        }

        .results-column-header {
            padding: 12px 16px;
            font-weight: 700;
            font-size: 15.6px; /* 30% larger than 12px */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-med);
            border-right: 1px solid var(--line);
            text-align: left;
        }

        .results-column-header:last-child {
            border-right: none;
        }

        .pos-col,
        .number-col,
        .gap-col {
            text-align: center;
        }

        .results-rows {
            max-height: 60vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .results-row {
            display: grid;
            grid-template-columns: 0.8fr 0.8fr 5.5fr 1.2fr;
            background: var(--bg-800);
            border-bottom: 1px solid var(--line);
            transition: all 150ms ease-out;
            opacity: 0;
            transform: translateY(-10px);
            position: relative;
            overflow: hidden;
        }

        .results-row.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .results-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        

        /* Winner styling - gold background */
        .results-row.winner {
            background: rgba(255, 215, 0, 0.2) !important;
            border-left: 4px solid #FFD700 !important;
        }

        .results-row.winner .results-cell {
            color: var(--text-hi) !important;
            font-weight: 700 !important;
        }
.results-row.revealed {
    opacity: 0.85;
}
        /* Podium styling */
        .results-row.podium {
            background: rgba(192, 192, 192, 0.15) !important;
            border-left: 4px solid #C0C0C0 !important;
        }

        .results-row.podium .results-cell {
            font-weight: 600 !important;
        }

        .results-cell {
            padding: 14px 16px;
            font-size: 18.2px; /* 30% larger than 14px */
            color: var(--text-hi);
            border-right: 1px solid var(--line);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .results-cell:last-child {
            border-right: none;
        }

        .results-cell.pos-cell,
        .results-cell.number-cell,
        .results-cell.gap-cell {
            justify-content: center;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .results-cell.pos-cell {
            font-size: 20px;
            font-weight: 800;
        }

        .results-cell.number-cell {
            font-weight: 700;
            background: rgba(255, 255, 255, 0.1);
            margin: 4px;
            border-radius: 4px;
        }

        .results-cell.driver-cell {
            font-weight: 700;
            text-transform: uppercase;
        }

        .results-cell.team-cell {
            font-weight: 500;
            color: var(--text-med);
            text-transform: uppercase;
            font-size: 16px;
        }

        .results-cell.gap-cell {
            font-weight: 600;
            color: var(--text-med);
        }

        /* White wipe effect */
        .results-row::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transition: left 600ms ease-out;
            z-index: 2;
        }

        .results-row.wiping::before {
            left: 100%;
        }

        /* DNF/DNS styling */
        .results-row.dnf {
            background: rgba(255, 0, 0, 0.1) !important;
            border-left: 4px solid #ff4444 !important;
        }

        .results-row.dnf .results-cell.gap-cell {
            color: #ff4444 !important;
            font-weight: 700 !important;
        }

        /* Hashtag line */
        .results-hashtag-line {
            background: var(--bg-700);
            padding: 16px 32px;
            border-top: 1px solid var(--line);
            text-align: center;
            transform: translateY(0);
            transition: transform 400ms ease-out, opacity 400ms ease-out;
            opacity: 1;
            position: relative;
            z-index: 10;
        }

        .results-hashtag-line.hidden {
            transform: translateY(100%);
            opacity: 0;
        }

        .results-hashtag-line span {
            font-weight: 700;
            font-size: 20.8px; /* 30% larger than 16px */
            color: var(--text-hi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Scrollbar styling */
        .results-rows::-webkit-scrollbar {
            width: 6px;
        }

        .results-rows::-webkit-scrollbar-track {
            background: var(--bg-900);
        }

        .results-rows::-webkit-scrollbar-thumb {
            background: var(--line);
        }

        .results-rows::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Animation states */
        .results.animating .results-rows {
            max-height: 0;
            overflow: hidden;
            transition: max-height 400ms ease-out;
        }

        .results.animating.revealed .results-rows {
            max-height: 60vh;
        }
    </style>

    <script>
        // Animate out, called by SPX
        function runAnimationOUT() {
            const results = document.getElementById('results');
            if (results) {
                results.style.opacity = '0';
            }
            console.log('Results animated out');
        }

        // Application state
        let resultsState = {
            isVisible: false,
            isAnimating: false,
            lastTimingDataRaw: null
        };

        // Results data
        let resultsData = [];

        // Parse timing data from text format
        function parseTimingData(text) {
            const lines = text.trim().split('\n');
            const data = {};
            
            // Parse each line in key=value format
            lines.forEach(line => {
                const [key, value] = line.split('=');
                if (key && value !== undefined) {
                    // Trim whitespace and handle empty values
                    const trimmedValue = value.trim();
                    data[key.trim()] = trimmedValue === '' ? '' : trimmedValue;
                }
            });
            
            // Extract race information
            const raceInfo = {
                totalLaps: parseInt(data.laps) || 20,
                flag: data.flag || '',
                flagImage: data.flagimg || 'none.png'
            };
            
            // Extract positions data
            const positions = [];
            let posIndex = 1;
            
            while (data[`pos${posIndex}fname`] !== undefined) {
                const pos = {
                    position: posIndex,
                    firstName: data[`pos${posIndex}fname`] || '',
                    lastName: data[`pos${posIndex}lname`] || '',
                    number: data[`pos${posIndex}num`] || '',
                    time: data[`pos${posIndex}time`] || '00.000',
                    laps: parseInt(data[`pos${posIndex}laps`]) || 0,
                    bestLap: parseInt(data[`pos${posIndex}blap`]) || 0,
                    bestTime: data[`pos${posIndex}btime`] || '00.000',
                    timeDiff: data[`pos${posIndex}diff`] || '',
                    speed: parseInt(data[`pos${posIndex}speed`]) || 0,
                    bestSpeed: parseInt(data[`pos${posIndex}bspeed`]) || 0,
                    nationality: data[`pos${posIndex}nationality`] || '',
                    additional: data[`pos${posIndex}additional`] || ''
                };
                positions.push(pos);
                posIndex++;
            }
            
            return {
                race: raceInfo,
                positions
            };
        }

        // Load results from timing data
        async function loadResultsFromTiming() {
            try {
                console.log('=== STARTING TIMING DATA LOAD FOR RESULTS ===');
                
                const response = await fetch('timing_data.txt?' + Date.now()); // Cache busting
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const text = await response.text();
                
                // Check if data has actually changed before parsing
                if (text === resultsState.lastTimingDataRaw) {
                    console.log('Timing data unchanged, skipping update');
                    return true;
                }
                
                const timingData = parseTimingData(text);
                resultsState.lastTimingDataRaw = text;
                
                console.log('Parsed timing data:', timingData);
                console.log('Number of position entries:', timingData.positions.length);
                
                if (timingData.positions && timingData.positions.length > 0) {
                    // Map timing data to results format
                    resultsData = timingData.positions.map((pos, index) => {
                        const fullName = `${pos.firstName} ${pos.lastName}`.trim();
                        const isDNF = pos.timeDiff && (pos.timeDiff.toUpperCase().includes('DNF') || 
                                                      pos.timeDiff.toUpperCase().includes('DNS') || 
                                                      pos.timeDiff.toUpperCase().includes('DSQ'));
                        
                        let gap;
                        if (index === 0) {
                            gap = 'WINNER';
                        } else if (isDNF) {
                            gap = pos.timeDiff.toUpperCase();
                        } else if (pos.timeDiff && pos.timeDiff !== '') {
                            gap = pos.timeDiff;
                        } else {
                            gap = `+${index * 2}.${Math.floor(Math.random() * 9)}s`;
                        }
                        
                        return {
                            position: pos.position.toString(),
                            number: pos.number || pos.position.toString(),
                            driver: fullName || `Driver ${pos.position}`,
                            team: pos.additional || `Team ${pos.position}`,
                            gap: gap,
                            dnf: isDNF
                        };
                    });
                    
                    console.log('Mapped results data:', resultsData);
                    console.log('Final results data length:', resultsData.length);
                    
                    // Re-render results with new data
                    renderResults();
                    
                    // Update race info
                    if (timingData.race.totalLaps) {
                        document.getElementById('raceInfo').textContent = `${timingData.race.totalLaps} LAPS`;
                    }
                    
                    console.log('=== TIMING DATA RESULTS LOAD SUCCESS ===');
                    return true;
                } else {
                    console.warn('No position data found in timing file');
                    console.log('=== TIMING DATA RESULTS LOAD FAILED - NO DATA ===');
                    return false;
                }
            } catch (error) {
                console.error('Failed to load results from timing data:', error);
                console.log('=== TIMING DATA RESULTS LOAD FAILED - ERROR ===');
                return false;
            }
        }

        // Scroll state
        let scrollState = {
            isAtTop: true,
            totalRows: 0,
            maxVisibleRows: 15
        };

        // Event data
        let eventData = {
            raceTitle: "Race Results",
            raceInfo: "",
            hashtag: "#Loading"
        };

        // Initialize results with fallback data
        if (!resultsData || resultsData.length === 0) {
            resultsData = [
                // Fallback data if timing data loading fails
                { position: "ERR", number: "ERR", driver: "ERR - Timing Data Not Loaded", team: "ERR - Timing Data Not Loaded", gap: "ERR", dnf: false },
                { position: "ERR", number: "ERR", driver: "ERR - Timing Data Not Loaded", team: "ERR - Timing Data Not Loaded", gap: "ERR", dnf: false },
                { position: "ERR", number: "ERR", driver: "ERR - Timing Data Not Loaded", team: "ERR - Timing Data Not Loaded", gap: "ERR", dnf: false }
            ];
        }

        // Initialize results
        async function init() {
            setupEventListeners();
            
            // Try to load results from timing data first
            const timingLoaded = await loadResultsFromTiming();
            
            if (!timingLoaded) {
                // Use fallback data and render
                renderResults();
            }
            
            updateUI();
            console.log('Results display initialized');
            console.log('Keyboard shortcuts: SPACE (toggle results), ESC (hide results), R (reload timing data)');
        }

        // Update UI elements with current data
        function updateUI() {
            document.getElementById('raceTitle').textContent = eventData.raceTitle;
            document.getElementById('raceInfo').textContent = eventData.raceInfo;
            document.getElementById('resultsHashtag').textContent = eventData.hashtag;
        }

        // Setup event listeners
        function setupEventListeners() {
            document.addEventListener('keydown', handleKeyPress);
        }

        // Handle keyboard shortcuts
        function handleKeyPress(event) {
            const key = event.key.toLowerCase();
            
            switch (key) {
                case ' ':
                    event.preventDefault();
                    toggleResults();
                    break;
                case 'escape':
                    hideResults();
                    break;
                case 'r':
                    // R key to reload timing data
                    console.log('Reloading results from timing data...');
                    loadResultsFromTiming();
                    break;
            }
        }

        // Toggle results visibility
        function toggleResults() {
            if (resultsState.isAnimating) return;
            
            if (resultsState.isVisible) {
                hideResults();
            } else {
                showResults();
            }
        }

        // Show results with animation
        async function showResults() {
            if (resultsState.isAnimating || resultsState.isVisible) return;
            
            resultsState.isAnimating = true;
            
            // Refresh timing data before showing
            console.log('Refreshing timing data before showing results...');
            await loadResultsFromTiming();
            
            const results = document.getElementById('results');
            const hashtagLine = document.getElementById('resultsHashtagLine');
            
            // Reset all rows to hidden state
            const rows = document.querySelectorAll('.results-row');
            rows.forEach(row => {
                row.classList.remove('revealed', 'wiping');
            });
            
            // Show results container
            results.classList.add('show');
            
            // Wait for container animation
            await sleep(400);
            
            // Hide hashtag line
            hashtagLine.classList.add('hidden');
            
            // Wait for hashtag to hide
            await sleep(200);
            
            // Reveal rows one by one with wipe effect
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                
                // Start wipe effect
                row.classList.add('wiping');
                
                // Reveal row after short delay
                setTimeout(() => {
                    row.classList.add('revealed');
                }, 100);
                
                // Wait between rows (shorter delay for winner)
                await sleep(i === 0 ? 150 : 80);
            }
            
            resultsState.isVisible = true;
            resultsState.isAnimating = false;
            
            console.log('Results opened');
        }

        // Hide results
        async function hideResults() {
            if (resultsState.isAnimating || !resultsState.isVisible) return;
            
            resultsState.isAnimating = true;
            const results = document.getElementById('results');
            const hashtagLine = document.getElementById('resultsHashtagLine');
            
            // Show hashtag line
            hashtagLine.classList.remove('hidden');
            
            // Hide results container
            results.classList.remove('show');
            
            // Wait for animation
            await sleep(400);
            
            // Refresh timing data after hiding for next time
            console.log('Refreshing timing data after hiding results...');
            loadResultsFromTiming(); // Don't await this, let it run in background
            
            resultsState.isVisible = false;
            resultsState.isAnimating = false;
            
            console.log('Results closed');
        }

        // Render results rows
        function renderResults() {
            const container = document.getElementById('resultsRows');
            container.innerHTML = '';

            // Render data rows
            resultsData.forEach((item, index) => {
                const row = createResultRow(item, index);
                container.appendChild(row);
            });

            // Update scroll state
            updateScrollState();
        }

        // Create result row element
        function createResultRow(data, index) {
            const row = document.createElement('div');
            row.className = 'results-row';
            
            // Add special styling based on position
            if (index === 0 && !data.dnf) {
                row.classList.add('winner');
                console.log(`Adding winner class to position 1:`, data);
            } else if (index < 3 && !data.dnf) {
                row.classList.add('podium');
                console.log(`Adding podium class to position ${index + 1}:`, data);
            }
            
            if (data.dnf) {
                row.classList.add('dnf');
                console.log(`Adding DNF class to position ${index + 1}:`, data);
            }

            row.innerHTML = `
                <div class="results-cell pos-cell">${data.position}</div>
                <div class="results-cell number-cell">${data.number}</div>
                <div class="results-cell driver-cell">${data.driver}</div>
                <div class="results-cell gap-cell">${data.gap}</div>
            `;

            return row;
        }

        // Update scroll state 
        function updateScrollState() {
            scrollState.totalRows = resultsData.length;
            scrollState.isAtTop = true; // Reset to top when data changes
        }

        // Handle scroll toggle (keyboard only for broadcast)
        function toggleScroll() {
            const resultsRows = document.getElementById('resultsRows');
            
            if (scrollState.totalRows <= scrollState.maxVisibleRows) {
                // No scrolling needed
                return;
            }
            
            if (scrollState.isAtTop) {
                // Scroll to bottom
                resultsRows.scrollTo({
                    top: resultsRows.scrollHeight,
                    behavior: 'smooth'
                });
                scrollState.isAtTop = false;
            } else {
                // Scroll to top
                resultsRows.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
                scrollState.isAtTop = true;
            }
        }

        // Utility function for delays
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the app
            init();
            
            // Show results automatically on page load with a delay
            setTimeout(() => {
                showResults();
            }, 300);
            
            // Add keyboard shortcut for scrolling (S key) - broadcast friendly
            document.addEventListener('keydown', function(event) {
                if (event.key.toLowerCase() === 's' && scrollState.totalRows > scrollState.maxVisibleRows) {
                    event.preventDefault();
                    toggleScroll();
                }
            });
        });
    </script>
</body>
</html>
