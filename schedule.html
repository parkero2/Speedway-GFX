<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Event Schedule - Motorsport Graphics</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="overlay" class="overlay">
        <!-- Schedule Component -->
        <div id="schedule" class="schedule">
            <div class="schedule-panel">
                <!-- Header -->
                <div class="schedule-header">
                    <div class="schedule-logo">
                        <img src="assets/logo.svg" alt="Logo" class="header-logo">
                    </div>
                    <div class="schedule-title">
                        <span id="eventName">SPEEDWAY CHAMPIONSHIPS</span>
                    </div>
                    <div class="schedule-time">
                        <span id="eventTime">19:00</span>
                    </div>
                </div>

                <!-- Column Headers -->
                <div class="schedule-columns">
                    <div class="schedule-column-header event-col">EVENT</div>
                    <div class="schedule-column-header time-col">TIME</div>
                    <div class="schedule-column-header class-col">CLASS</div>
                    <div class="schedule-column-header session-col">SESSION</div>
                    <div class="schedule-column-header laps-col">LAPS</div>
                </div>

                <!-- Schedule Rows -->
                <div class="schedule-rows" id="scheduleRows">
                    <!-- Rows will be generated by JavaScript -->
                </div>

                <!-- Hashtag Line -->
                                <!-- Hashtag Line -->
                <div class="schedule-hashtag-line" id="scheduleHashtagLine">
                    <span id="scheduleHashtag">#Loading</span>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Schedule Component Styles */
        .schedule {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 60vw;
            max-width: 1200px;
            min-width: 800px;
            z-index: 120;
            opacity: 0;
            transition: all 400ms cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .schedule.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .schedule-panel {
            background: var(--bg-900);
            border: 1px solid var(--line);
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            /* Diagonal cutouts - swapped corners */
            clip-path: polygon(
                0% 0%, 
                calc(100% - 20px) 0%, 
                100% 20px, 
                100% 100%, 
                20px 100%, 
                0% calc(100% - 20px)
            );
        }

        .schedule-header {
            background: var(--bg-700);
            padding: 24px 32px;
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            align-items: center;
            gap: 24px;
        }

        .schedule-logo {
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 72px;
            width: auto;
        }

        .schedule-title {
            font-weight: 800;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-hi);
            text-align: center;
        }

        .schedule-time {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-hi);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .schedule-columns {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr 2fr 1fr;
            background: var(--bg-800);
            border-bottom: 2px solid var(--line);
        }

        .schedule-column-header {
            padding: 12px 16px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-med);
            border-right: 1px solid var(--line);
            text-align: left;
        }

        .schedule-column-header:last-child {
            border-right: none;
        }

        .time-col,
        .laps-col {
            text-align: center;
        }

        .schedule-rows {
            max-height: 60vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .schedule-row {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr 2fr 1fr;
            background: var(--bg-800);
            border-bottom: 1px solid var(--line);
            transition: all 150ms ease-out;
            opacity: 0;
            transform: translateY(-10px);
            position: relative;
            overflow: hidden;
        }

        .schedule-row.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .schedule-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .schedule-row.current {
            background: rgba(0, 176, 80, 0.15);
            border-left: 4px solid var(--flag-green);
        }

        .schedule-row.next {
            background: rgba(255, 204, 0, 0.15);
            border-left: 4px solid var(--flag-yellow);
        }

        .schedule-cell {
            padding: 14px 16px;
            font-size: 14px;
            color: var(--text-hi);
            border-right: 1px solid var(--line);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .schedule-cell:last-child {
            border-right: none;
        }

        .schedule-cell.time-cell,
        .schedule-cell.laps-cell {
            justify-content: center;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .schedule-cell.event-cell {
            font-weight: 600;
        }

        .schedule-cell.class-cell {
            font-weight: 500;
        }

        .schedule-cell.session-cell {
            font-weight: 500;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        /* White wipe effect */
        .schedule-row::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transition: left 600ms ease-out;
            z-index: 2;
        }

        .schedule-row.wiping::before {
            left: 100%;
        }

        /* Empty row styling */
        .schedule-row.empty {
            opacity: 0.3;
        }

        .schedule-row.empty .schedule-cell {
            color: var(--text-med);
            font-style: italic;
        }

        /* Hashtag line */
        .schedule-hashtag-line {
            background: var(--bg-700);
            padding: 16px 32px;
            border-top: 1px solid var(--line);
            text-align: center;
            transform: translateY(0);
            transition: transform 400ms ease-out, opacity 400ms ease-out;
            opacity: 1;
            position: relative;
            z-index: 10;
        }

        .schedule-hashtag-line.hidden {
            transform: translateY(100%);
            opacity: 0;
        }

        .schedule-hashtag-line span {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-hi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Scrollbar styling */
        .schedule-rows::-webkit-scrollbar {
            width: 6px;
        }

        .schedule-rows::-webkit-scrollbar-track {
            background: var(--bg-900);
        }

        .schedule-rows::-webkit-scrollbar-thumb {
            background: var(--line);
        }

        .schedule-rows::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Animation states */
        .schedule.animating .schedule-rows {
            max-height: 0;
            overflow: hidden;
            transition: max-height 400ms ease-out;
        }

        .schedule.animating.revealed .schedule-rows {
            max-height: 60vh;
        }
    </style>

    <script>
        // Application state - sourced like index.html
        let scheduleState = {
            isVisible: false,
            isAnimating: false
        };

        // Event data (will be loaded from sample-data.json)
        let eventData = {
            venue: "Loading...",
            hashtag: "#Loading"
        };

        // Load event data from sample-data.json
        async function loadEventData() {
            try {
                const response = await fetch('assets/sample-data.json');
                const data = await response.json();
                
                eventData.venue = data.event.venue;
                eventData.hashtag = data.event.hashtag;
                
                // Update UI with loaded data
                updateUI();
                console.log('Event data loaded:', eventData);
            } catch (error) {
                console.error('Failed to load event data:', error);
                // Fallback values
                eventData.venue = "Speedway Championships";
                eventData.hashtag = "#SpeedwayChampionships";
                updateUI();
            }
        }

        // Get current time
        function getCurrentTime() {
            const now = new Date();
            return now.toTimeString().slice(0, 5); // Format: HH:MM
        }

        // Sample schedule data with realistic speedway content
        const scheduleData = [
            { event: "1", time: "17:00", class: "Ministocks", session: "Heat 1", laps: "10" },
            { event: "2", time: "17:15", class: "Midgets", session: "Heat 1", laps: "12" },
            { event: "3", time: "17:30", class: "Street Stocks", session: "Heat 1", laps: "15" },
            { event: "4", time: "17:45", class: "Sprintcars", session: "Heat 1", laps: "15" },
            { event: "5", time: "18:00", class: "Super Saloons", session: "Heat 1", laps: "15" },
            { event: "6", time: "18:20", class: "Ministocks", session: "Heat 2", laps: "10" },
            { event: "7", time: "18:35", class: "Midgets", session: "Heat 2", laps: "12" },
            { event: "8", time: "18:50", class: "Street Stocks", session: "Heat 2", laps: "15" },
            { event: "9", time: "19:05", class: "Sprintcars", session: "Heat 2", laps: "15" },
            { event: "10", time: "19:25", class: "Super Saloons", session: "Heat 2", laps: "15" },
            { event: "11", time: "19:45", class: "Ministocks", session: "Feature Race", laps: "20" },
            { event: "12", time: "20:05", class: "Midgets", session: "Feature Race", laps: "25" },
            { event: "13", time: "20:30", class: "Street Stocks", session: "Feature Race", laps: "25" },
            { event: "14", time: "20:55", class: "Sprintcars", session: "Feature Race", laps: "25" },
            { event: "15", time: "21:25", class: "Super Saloons", session: "Feature Race", laps: "25" }
        ];

        // Initialize schedule
        async function init() {
            setupEventListeners();
            await loadEventData(); // Load data from JSON first
            renderSchedule();
            console.log('Schedule display initialized');
            console.log('Keyboard shortcuts: SPACE (toggle schedule), ESC (hide schedule)');
        }

        // Update UI elements with current data
        function updateUI() {
            document.getElementById('eventName').textContent = eventData.venue.toUpperCase();
            document.getElementById('eventTime').textContent = getCurrentTime();
            document.getElementById('scheduleHashtag').textContent = eventData.hashtag;
        }

        // Setup event listeners
        function setupEventListeners() {
            document.addEventListener('keydown', handleKeyPress);
            
            // Update time every minute
            setInterval(() => {
                document.getElementById('eventTime').textContent = getCurrentTime();
            }, 60000);
        }

        // Handle keyboard shortcuts
        function handleKeyPress(event) {
            const key = event.key.toLowerCase();
            
            switch (key) {
                case ' ':
                    event.preventDefault();
                    toggleSchedule();
                    break;
                case 'escape':
                    hideSchedule();
                    break;
            }
        }

        // Toggle schedule visibility
        function toggleSchedule() {
            if (scheduleState.isAnimating) return;
            
            if (scheduleState.isVisible) {
                hideSchedule();
            } else {
                showSchedule();
            }
        }

        // Show schedule with animation
        async function showSchedule() {
            if (scheduleState.isAnimating || scheduleState.isVisible) return;
            
            scheduleState.isAnimating = true;
            const schedule = document.getElementById('schedule');
            const hashtagLine = document.getElementById('scheduleHashtagLine');
            
            // Reset all rows to hidden state
            const rows = document.querySelectorAll('.schedule-row');
            rows.forEach(row => {
                row.classList.remove('revealed', 'wiping');
            });
            
            // Show schedule container
            schedule.classList.add('show');
            
            // Wait for container animation
            await sleep(400);
            
            // Hide hashtag line
            hashtagLine.classList.add('hidden');
            
            // Wait for hashtag to hide
            await sleep(200);
            
            // Reveal rows one by one with wipe effect
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                
                // Start wipe effect
                row.classList.add('wiping');
                
                // Reveal row after short delay
                setTimeout(() => {
                    row.classList.add('revealed');
                }, 100);
                
                // Wait between rows
                await sleep(80);
            }
            
            scheduleState.isVisible = true;
            scheduleState.isAnimating = false;
            
            console.log('Schedule opened');
        }

        // Hide schedule
        async function hideSchedule() {
            if (scheduleState.isAnimating || !scheduleState.isVisible) return;
            
            scheduleState.isAnimating = true;
            const schedule = document.getElementById('schedule');
            const hashtagLine = document.getElementById('scheduleHashtagLine');
            
            // Show hashtag line
            hashtagLine.classList.remove('hidden');
            
            // Hide schedule container
            schedule.classList.remove('show');
            
            // Wait for animation
            await sleep(400);
            
            scheduleState.isVisible = false;
            scheduleState.isAnimating = false;
            
            console.log('Schedule closed');
        }

        // Render schedule rows
        function renderSchedule() {
            const container = document.getElementById('scheduleRows');
            container.innerHTML = '';

            // Render data rows
            scheduleData.forEach((item, index) => {
                const row = createScheduleRow(item, index);
                container.appendChild(row);
            });
        }

        // Create schedule row element
        function createScheduleRow(data, index) {
            const row = document.createElement('div');
            row.className = 'schedule-row';

            row.innerHTML = `
                <div class="schedule-cell event-cell">${data.event}</div>
                <div class="schedule-cell time-cell">${data.time}</div>
                <div class="schedule-cell class-cell">${data.class}</div>
                <div class="schedule-cell session-cell">${data.session}</div>
                <div class="schedule-cell laps-cell">${data.laps}</div>
            `;

            return row;
        }

        // Utility function for delays
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
