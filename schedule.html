<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Event Schedule - Motorsport Graphics</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="./spx_interface.js"></script>
    <script src="speedway-data-reader.js"></script>
    <script>
        window.SPXGCTemplateDefinition = {
            description: "Event Schedule",
            playserver: "OVERLAY",
            playchannel: "1",
            playlayer: "11",
            webplayout: "11",
            out: "manual",
            dataformat: "json",
            uicolor: "5",
        }
        /**
         * SPX COMPANION FUNCTION CALLS
         * 
         * Available companion functions (call these from SPX or console):
         * - toggleSchedule()                       // show/hide schedule
         * - showSchedule()                         // show schedule with animation
         * - hideSchedule()                         // hide schedule
         * - loadScheduleFromExcel()                // reload schedule data from Excel
         * - toggleScroll()                         // scroll between top/bottom if needed
         *
         * Keyboard shortcuts:
         * - SPACE = Toggle Schedule
         * - ESC = Hide Schedule  
         * - R = Reload Excel Data
         * - S = Toggle Scroll (if more than 15 rows)
         *
         * Example usages:
         *   showSchedule();
         *   hideSchedule();
         *   loadScheduleFromExcel();
         */
    </script>
</head>
<body>
    <div id="overlay" class="overlay">
        <!-- Schedule Component -->
        <div id="schedule" class="schedule">
            <div class="schedule-panel">
                <!-- Header -->
                <div class="schedule-header">
                    <div class="schedule-logo">
                        <img src="assets/logo.svg" alt="Logo" class="header-logo">
                    </div>
                    <div class="schedule-title">
                        <span id="eventName">SPEEDWAY CHAMPIONSHIPS</span>
                    </div>
                    <div class="schedule-sponsors-logo" id="scheduleSponsorsLogo">
                        <img id="sponsorsLogoImg" src="" alt="Sponsors" class="sponsors-logo">
                    </div>
                    <div class="schedule-time">
                        <span id="eventTime">19:00</span>
                    </div>
                </div>

                <!-- Column Headers -->
                <div class="schedule-columns">
                    <div class="schedule-column-header event-col">EVENT</div>
                    <div class="schedule-column-header class-col">CLASS</div>
                    <div class="schedule-column-header session-col">HEAT</div>
                    <div class="schedule-column-header laps-col">LAPS</div>
                </div>

                <!-- Schedule Rows -->
                <div class="schedule-rows" id="scheduleRows">
                    <!-- Rows will be generated by JavaScript -->
                </div>

                <!-- Hashtag Line -->
                                <!-- Hashtag Line -->
                <div class="schedule-hashtag-line" id="scheduleHashtagLine">
                    <span id="scheduleHashtag">#Loading</span>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Schedule Component Styles */
        .schedule {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 60vw;
            max-width: 1200px;
            min-width: 800px;
            z-index: 120;
            opacity: 0;
            transition: all 400ms cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .schedule.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .schedule-panel {
            background: var(--bg-900);
            border: 1px solid var(--line);
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            /* Diagonal cutouts - swapped corners */
            clip-path: polygon(
                0% 0%, 
                calc(100% - 20px) 0%, 
                100% 20px, 
                100% 100%, 
                20px 100%, 
                0% calc(100% - 20px)
            );
        }

        .schedule-header {
            background: var(--bg-700);
            padding: 16px 20px; /* Reduced from 24px 32px */
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 200px 1fr auto 200px;
            align-items: center;
            gap: 16px; /* Reduced from 24px */
        }

        .schedule-logo {
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 72px;
            width: auto;
        }

        .schedule-title {
            font-weight: 800;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-hi);
            text-align: center;
        }

        .schedule-time {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-hi);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .schedule-sponsors-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0; /* Remove any default margins */
            padding: 0; /* Remove any default padding */
        }

        .sponsors-logo {
            max-height: 82px; /* 70% larger than 48px (48 * 1.7 ≈ 82) */
            max-width: 255px; /* 70% larger than 150px (150 * 1.7 = 255) */
            width: auto;
            height: auto;
            object-fit: contain;
            margin: 0; /* Remove any default margins */
            padding: 0; /* Remove any default padding */
        }

        .schedule-columns {
            display: grid;
            grid-template-columns: 0.6fr 1fr 2fr 1fr;
            background: var(--bg-800);
            border-bottom: 2px solid var(--line);
        }

        .schedule-column-header {
            padding: 12px 16px;
            font-weight: 700;
            font-size: 15.6px; /* 30% larger than 12px */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-med);
            border-right: 1px solid var(--line);
            text-align: left;
        }

        .schedule-column-header:last-child {
            border-right: none;
        }

        .time-col,
        .time-col,
        .laps-col {
            text-align: center;
        }

        .schedule-rows {
            max-height: 60vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .schedule-row {
            display: grid;
            grid-template-columns: 0.6fr 1fr 2fr 1fr;
            background: var(--bg-800);
            border-bottom: 1px solid var(--line);
            transition: all 150ms ease-out;
            opacity: 0;
            transform: translateY(-10px);
            position: relative;
            overflow: hidden;
        }

        .schedule-row.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .schedule-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .schedule-row.current {
            background: rgba(0, 176, 80, 0.15);
            border-left: 4px solid var(--flag-green);
        }

        .schedule-row.next {
            background: rgba(255, 204, 0, 0.15);
            border-left: 4px solid var(--flag-yellow);
        }

        .schedule-cell {
            padding: 14px 16px;
            font-size: 18.2px; /* 30% larger than 14px */
            color: var(--text-hi);
            border-right: 1px solid var(--line);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .schedule-cell:last-child {
            border-right: none;
        }

        .schedule-cell.time-cell,
        .schedule-cell.time-cell,
        .schedule-cell.laps-cell {
            justify-content: center;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .schedule-cell.event-cell {
            font-weight: 600;
            justify-content: center; /* Center justify numbers in event column */
        }

        .schedule-cell.event-name-cell {
            font-weight: 500;
            font-size: 18.2px;
        }

        .schedule-cell.class-cell {
            font-weight: 500;
            font-size: 17.4px; /* 20% smaller than 21.8px */
        }

        .schedule-cell.session-cell {
            font-weight: 500;
            text-transform: uppercase;
            font-size: 15.6px; /* 30% larger than 12px */
            letter-spacing: 0.3px;
        }

        /* Feature race styling - light grey background with dark text */
        .schedule-row.feature-race {
            background: rgba(220, 220, 220, 0.95) !important; /* Very light grey background */
            border-left: 4px solid #888888 !important; /* Add a grey border to make it obvious */
        }

        .schedule-row.feature-race .schedule-cell {
            color: #2a2a2a !important; /* Very dark grey text */
            font-weight: 600 !important; /* Slightly bold for better readability */
        }

        .schedule-row.feature-race:hover {
            background: rgba(210, 210, 210, 0.95) !important; /* Slightly darker on hover */
        }

        /* Debug styling removed - no more Feature text */
        /* .schedule-row.feature-race::after {
            content: " [FEATURE]";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff0000;
            font-weight: bold;
            font-size: 10px;
        } */

        /* White wipe effect */
        .schedule-row::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transition: left 600ms ease-out;
            z-index: 2;
        }

        .schedule-row.wiping::before {
            left: 100%;
        }

        /* Empty row styling */
        .schedule-row.empty {
            opacity: 0.3;
        }

        .schedule-row.empty .schedule-cell {
            color: var(--text-med);
            font-style: italic;
        }

        /* Hashtag line */
        .schedule-hashtag-line {
            background: var(--bg-700);
            padding: 16px 32px;
            border-top: 1px solid var(--line);
            text-align: center;
            transform: translateY(0);
            transition: transform 400ms ease-out, opacity 400ms ease-out;
            opacity: 1;
            position: relative;
            z-index: 10;
        }

        .schedule-hashtag-line.hidden {
            transform: translateY(100%);
            opacity: 0;
        }

        .schedule-hashtag-line span {
            font-weight: 700;
            font-size: 20.8px; /* 30% larger than 16px */
            color: var(--text-hi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Scrollbar styling */
        .schedule-rows::-webkit-scrollbar {
            width: 6px;
            display: none;
        }

        .schedule-rows::-webkit-scrollbar-track {
            background: var(--bg-900);
        }

        .schedule-rows::-webkit-scrollbar-thumb {
            background: var(--line);
        }

        .schedule-rows::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Animation states */
        .schedule.animating .schedule-rows {
            max-height: 0;
            overflow: hidden;
            transition: max-height 400ms ease-out;
        }

        .schedule.animating.revealed .schedule-rows {
            max-height: 60vh;
        }
    </style>

    <script>
        // Animate out, called by SPX
        function runAnimationOUT() {
            const schedule = document.getElementById('schedule');
            if (schedule) {
                schedule.style.opacity = '0';
            }
            console.log('Schedule animated out');
        }

        // Application state - sourced like index.html
        let scheduleState = {
            isVisible: false,
            isAnimating: false
        };

        // Scroll state
        let scrollState = {
            isAtTop: true,
            totalRows: 0,
            maxVisibleRows: 15
        };

        // Event data (will be loaded from sample-data.json)
        let eventData = {
            venue: "Loading...",
            hashtag: "#Loading"
        };

        // Load event data from sample-data.json
        async function loadEventData() {
            try {
                const response = await fetch('./assets/sample-data.json');
                const data = await response.json();
                
                eventData.venue = data.event.venue;
                eventData.hashtag = data.event.hashtag;
                
                // Update UI with loaded data
                updateUI();
                console.log('Event data loaded:', eventData);
            } catch (error) {
                console.error('Failed to load event data:', error);
                // Fallback values
                eventData.venue = "Speedway Championships";
                eventData.hashtag = "#SpeedwayChampionships";
                updateUI();
            }
        }

        // Get current time
        function getCurrentTime() {
            const now = new Date();
            return now.toTimeString().slice(0, 5); // Format: HH:MM
        }

        // Schedule data - will be loaded from Excel
        let scheduleData = [
            // Fallback data if Excel loading fails
            { event: "ERR", eventName: "ERR - Excel Not Loaded", class: "ERR", session: "ERR - Excel Not Loaded", laps: "ERR", featureRace: false },
            { event: "ERR", eventName: "ERR - Excel Not Loaded", class: "ERR", session: "ERR - Excel Not Loaded", laps: "ERR", featureRace: false },
            { event: "ERR", eventName: "ERR - Excel Not Loaded", class: "ERR", session: "ERR - Excel Not Loaded", laps: "ERR", featureRace: false }
        ];

        // Load schedule data from Excel
        async function loadScheduleFromExcel() {
            try {
                console.log('=== STARTING EXCEL LOAD ===');
                
                if (!window.speedwayData) {
                    console.error('speedwayData not available');
                    return false;
                }
                
                await window.speedwayData.loadExcelData();
                const excelScheduleData = window.speedwayData.getScheduleData();
                
                console.log('Raw Excel schedule data:', excelScheduleData);
                console.log('Number of schedule rows from Excel:', excelScheduleData ? excelScheduleData.length : 0);
                
                if (excelScheduleData && excelScheduleData.length > 0) {
                    console.log('First Excel schedule item properties:', Object.keys(excelScheduleData[0]));
                    console.log('First Excel schedule item:', excelScheduleData[0]);
                    
                    // Map Excel data to schedule format
                    scheduleData = excelScheduleData.map((item, index) => {
                        const featureRaceValue = item.featureRace;
                        const isFeatureRace = featureRaceValue === 'true' || featureRaceValue === true || featureRaceValue === 'TRUE';
                        
                        console.log(`Row ${index + 1}: featureRace = "${featureRaceValue}" (type: ${typeof featureRaceValue}) -> isFeatureRace: ${isFeatureRace}`);
                        
                        return {
                            event: (index + 1).toString(),
                            eventName: item.event || 'ERR', // Column B - Excel 'event' field
                            class: item.status || 'ERR', // Column E - Excel 'status' field (or use description)
                            session: item.description || 'ERR',
                            laps: item.notes || item.duration || 'ERR',
                            featureRace: isFeatureRace
                        };
                    });
                    
                    console.log('Mapped schedule data:', scheduleData);
                    console.log('Final schedule data length:', scheduleData.length);
                    
                    // Re-render schedule with new data
                    renderSchedule();
                    
                    // Update event info from Excel
                    const eventInfo = window.speedwayData.getEventInfo();
                    if (eventInfo && eventInfo.venueName) {
                        document.getElementById('eventName').textContent = eventInfo.venueName.toUpperCase();
                    }
                    if (eventInfo && eventInfo.eventName) {
                        document.getElementById('scheduleHashtag').textContent = `#${eventInfo.eventName.replace(/\s+/g, '')}`;
                    }
                    if (eventInfo && eventInfo.sponsorsLogo) {
                        const sponsorsLogoImg = document.getElementById('sponsorsLogoImg');
                        const sponsorsLogoContainer = document.getElementById('scheduleSponsorsLogo');
                        if (sponsorsLogoImg && eventInfo.sponsorsLogo.trim()) {
                            sponsorsLogoImg.src = eventInfo.sponsorsLogo.trim();
                            sponsorsLogoContainer.style.display = 'flex';
                            console.log('Sponsors logo loaded:', eventInfo.sponsorsLogo.trim());
                        } else {
                            sponsorsLogoContainer.style.display = 'none';
                            console.log('No sponsors logo found or empty path');
                        }
                    } else {
                        // Hide sponsors logo if no data
                        const sponsorsLogoContainer = document.getElementById('scheduleSponsorsLogo');
                        if (sponsorsLogoContainer) {
                            sponsorsLogoContainer.style.display = 'none';
                        }
                    }
                    
                    console.log('=== EXCEL LOAD SUCCESS ===');
                    return true;
                } else {
                    console.warn('No schedule data found in Excel or empty schedule');
                    console.log('=== EXCEL LOAD FAILED - NO DATA ===');
                    return false;
                }
            } catch (error) {
                console.error('Failed to load schedule from Excel:', error);
                console.log('=== EXCEL LOAD FAILED - ERROR ===');
                return false;
            }
        }

        // Initialize schedule
        async function init() {
            setupEventListeners();
            
            // Try to load schedule from Excel first
            const excelLoaded = await loadScheduleFromExcel();
            
            if (!excelLoaded) {
                // Fallback to loading from JSON if Excel fails
                await loadEventData();
            }
            
            renderSchedule();
            updateUI();
            console.log('Schedule display initialized');
            console.log('Keyboard shortcuts: SPACE (toggle schedule), ESC (hide schedule), R (reload Excel data)');
        }

        // Listen for Excel data loading events
        document.addEventListener('speedwayDataLoaded', function(event) {
            console.log('Speedway data loaded in schedule');
            loadScheduleFromExcel();
        });

        // Update UI elements with current data
        function updateUI() {
            document.getElementById('eventName').textContent = eventData.venue.toUpperCase();
            document.getElementById('eventTime').textContent = getCurrentTime();
            document.getElementById('scheduleHashtag').textContent = eventData.hashtag;
        }

        // Setup event listeners
        function setupEventListeners() {
            document.addEventListener('keydown', handleKeyPress);
            
            // Update time every minute
            setInterval(() => {
                document.getElementById('eventTime').textContent = getCurrentTime();
            }, 60000);
        }

        // Handle keyboard shortcuts
        function handleKeyPress(event) {
            const key = event.key.toLowerCase();
            
            switch (key) {
                case ' ':
                    event.preventDefault();
                    toggleSchedule();
                    break;
                case 'escape':
                    hideSchedule();
                    break;
                case 'r':
                    // R key to reload Excel data
                    console.log('Reloading schedule from Excel...');
                    loadScheduleFromExcel();
                    break;
            }
        }

        // Toggle schedule visibility
        function toggleSchedule() {
            if (scheduleState.isAnimating) return;
            
            if (scheduleState.isVisible) {
                hideSchedule();
            } else {
                showSchedule();
            }
        }

        // Show schedule with animation
        async function showSchedule() {
            if (scheduleState.isAnimating || scheduleState.isVisible) return;
            
            scheduleState.isAnimating = true;
            
            // Refresh Excel data before showing
            console.log('Refreshing Excel data before showing schedule...');
            await loadScheduleFromExcel();
            
            const schedule = document.getElementById('schedule');
            const hashtagLine = document.getElementById('scheduleHashtagLine');
            
            // Reset all rows to hidden state
            const rows = document.querySelectorAll('.schedule-row');
            rows.forEach(row => {
                row.classList.remove('revealed', 'wiping');
            });
            
            // Show schedule container
            schedule.classList.add('show');
            
            // Wait for container animation
            await sleep(400);
            
            // Hide hashtag line
            hashtagLine.classList.add('hidden');
            
            // Wait for hashtag to hide
            await sleep(200);
            
            // Reveal rows one by one with wipe effect
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                
                // Start wipe effect
                row.classList.add('wiping');
                
                // Reveal row after short delay
                setTimeout(() => {
                    row.classList.add('revealed');
                }, 100);
                
                // Wait between rows
                await sleep(80);
            }
            
            scheduleState.isVisible = true;
            scheduleState.isAnimating = false;
            
            console.log('Schedule opened');
        }

        // Hide schedule
        async function hideSchedule() {
            if (scheduleState.isAnimating || !scheduleState.isVisible) return;
            
            scheduleState.isAnimating = true;
            const schedule = document.getElementById('schedule');
            const hashtagLine = document.getElementById('scheduleHashtagLine');
            
            // Show hashtag line
            hashtagLine.classList.remove('hidden');
            
            // Hide schedule container
            schedule.classList.remove('show');
            
            // Wait for animation
            await sleep(400);
            
            // Refresh Excel data after hiding for next time
            console.log('Refreshing Excel data after hiding schedule...');
            loadScheduleFromExcel(); // Don't await this, let it run in background
            
            scheduleState.isVisible = false;
            scheduleState.isAnimating = false;
            
            console.log('Schedule closed');
        }

        // Render schedule rows
        function renderSchedule() {
            const container = document.getElementById('scheduleRows');
            container.innerHTML = '';

            // Render data rows
            scheduleData.forEach((item, index) => {
                const row = createScheduleRow(item, index);
                container.appendChild(row);
            });

            // Update scroll state
            updateScrollState();
        }

        // Create schedule row element
        function createScheduleRow(data, index) {
            const row = document.createElement('div');
            row.className = 'schedule-row';
            
            // Add feature race class if this is a feature race
            if (data.featureRace) {
                row.classList.add('feature-race');
                console.log(`Adding feature-race class to row ${index + 1}:`, data);
            } else {
                console.log(`Regular row ${index + 1}:`, data);
            }

            row.innerHTML = `
                <div class="schedule-cell event-cell">${data.event}</div>
                <div class="schedule-cell class-cell">${data.class}</div>
                <div class="schedule-cell session-cell">${data.session}</div>
                <div class="schedule-cell laps-cell">${data.laps}</div>
            `;

            return row;
        }

        // Update scroll state 
        function updateScrollState() {
            scrollState.totalRows = scheduleData.length;
            scrollState.isAtTop = true; // Reset to top when data changes
        }

        // Handle scroll toggle (keyboard only for broadcast)
        function toggleScroll() {
            const scheduleRows = document.getElementById('scheduleRows');
            
            if (scrollState.totalRows <= scrollState.maxVisibleRows) {
                // No scrolling needed
                return;
            }
            
            if (scrollState.isAtTop) {
                // Scroll to bottom
                scheduleRows.scrollTo({
                    top: scheduleRows.scrollHeight,
                    behavior: 'smooth'
                });
                scrollState.isAtTop = false;
            } else {
                // Scroll to top
                scheduleRows.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
                scrollState.isAtTop = true;
            }
        }

        // Utility function for delays
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the app
            init();
            
            // Show schedule automatically on page load with a delay
            setTimeout(() => {
                showSchedule();
            }, 300);
            
            // Add keyboard shortcut for scrolling (S key) - broadcast friendly
            document.addEventListener('keydown', function(event) {
                if (event.key.toLowerCase() === 's' && scrollState.totalRows > scrollState.maxVisibleRows) {
                    event.preventDefault();
                    toggleScroll();
                }
            });
        });

        // Expose functions to global scope for external access
        window.toggleSchedule = toggleSchedule;
        window.showSchedule = showSchedule;
        window.hideSchedule = hideSchedule;
        window.loadScheduleFromExcel = loadScheduleFromExcel;
        window.toggleScroll = toggleScroll;
    </script>
</body>
</html>
