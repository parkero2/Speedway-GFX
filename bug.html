<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Motorsport Broadcast Graphics Overlay</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script>
        window.SPXGCTemplateDefinition = {
            description: "Bug Graphic",
            playserver: "OVERLAY",
            playchannel: "1",
            playlayer: "9",
            webplayout: "9",
            out: "manual",
            dataformat: "json",
            uicolor: "3",
        }
        /**
         * COMPANION FUNCTION CALLS
         * 
         * Available companion functions (call these from the console or other scripts):
         * - toggleBugSlug()                       // expand/collapse venue slug
         * - toggleTower()                         // show/hide timing tower
         * - toggleStrip()                         // show/hide timing strip
         * - toggleWeather()                       // show/hide weather panel
         * - setFlag('no-light'|'green'|'yellow'|'red'|'finish') // set flag state
         * - showFlagTemporarily(durationMs = 2000) // show current flag then hide
         * - setLap(currentLap, totalLaps)         // update lap display & progress bar
         * - setProgress(percent)                  // set header progress bar (0-100)
         * - loadTimingData() -> Promise           // manually load timing JSON/data
         * - startTimingRefresh(intervalMs)        // start auto-refresh of timing data
         * - stopTimingRefresh()                   // stop auto-refresh of timing data
         * - pauseTimingRefresh() / resumeTimingRefresh()
         * - debugTimingData()                     // output timing mapping/debug info
         * - updateWeatherFromAPI() -> Promise     // manually refresh weather data
         * - toggleAutoWeather()                   // enable/disable automatic weather updates
         * - setWeatherLocation(lat, lon)          // set coordinates for weather lookups
         * - useMyLocation() -> Promise            // request geolocation and update weather
         * - setHashtag(text)                      // change the hashtag text shown on bug
         * - setLogo(src)                          // change logo image src in the bug
         * - updateRiderList(ridersArray)          // render/replace the full rider list
         * - addOrUpdateRider(riderObj)            // add or update a single rider row
         * - removeRider(id)                       // remove rider row by id
         * - clearRiders()                         // clear all rider rows
         *
         * Example usages:
         *   setFlag('yellow');
         *   setFlag('finish');  // Shows chequered flag and stays up
         *   setLap(5, 20);
         *   startTimingRefresh(1000);
         */
    </script>
</head>

<body>
    <div id="overlay" class="overlay">
        <!-- Bug Component (lower-left logo bug) -->
        <div id="bug" class="bug">
            <!-- Flag slug positioned outside panel to avoid clipping -->
            <div class="bug-slug" id="bugSlug">
                <span class="flag-notification" id="flagNotification">GREEN FLAG</span>
            </div>
            <div class="bug-panel">
                <div class="bug-logo">
                    <img src="assets/logo.svg" alt="Logo" class="logo-image">
                </div>
            </div>
            <div class="hashtag-line" id="hashtagLine">
                <span id="hashtag">#Loading</span>
            </div>
        </div>

        <!-- Timing Tower -->
        <div id="tower" class="tower">
            <div class="tower-panel">
                <!-- Header -->
                <div class="tower-header">
                    <div class="lap-info">
                        <span class="lap-text">LAP <span id="currentLap">3</span> OF <span
                                id="totalLaps">20</span></span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

                <!-- Rider Rows -->
                <div class="rider-rows" id="riderRows">
                    <!-- Rows will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Timing Strip (horizontal) -->
        <div id="timingStrip" class="timing-strip">
            <div class="strip-panel">
                <div class="strip-rows" id="stripRows">
                    <!-- Rows will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Weather Component -->
        <div id="weather" class="weather">
            <div class="weather-panel">
                <!-- Weather Icon Row -->
                <div class="weather-icon-row">
                    <img id="weatherIcon" src="assets/weather_icons/sunny.svg" alt="Weather" class="weather-icon">
                </div>

                <!-- Conditions Row -->
                <div class="weather-conditions-row">
                    <span id="weatherConditions" class="weather-conditions">Clear</span>
                </div>

                <!-- Temperature and Wind Row -->
                <div class="weather-details-row">
                    <div class="weather-temperature">
                        <span id="temperature">24°C</span>
                    </div>
                    <div class="weather-wind">
                        <span id="windDirection">NW</span>
                        <span id="windSpeed">15 km/h</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control Panel (top-right, mouse activated) -->
        <div id="controlBar" class="control-bar">
            <div class="control-panel">
                <div class="control-group">
                    <label>Current Lap:</label>
                    <input type="number" id="currentLapInput" min="1" value="3">
                </div>
                <div class="control-group">
                    <label>Total Laps:</label>
                    <input type="number" id="totalLapsInput" min="1" value="20">
                </div>
                <div class="control-group">
                    <label>Flag State:</label>
                    <div class="flag-buttons">
                        <button id="flagNoLight" class="flag-btn no-light">No Light</button>
                        <button id="flagGreen" class="flag-btn green">Green</button>
                        <button id="flagYellow" class="flag-btn yellow">Yellow</button>
                        <button id="flagRed" class="flag-btn red">Red</button>
                        <button id="flagFinish" class="flag-btn finish">Finish</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Toggles:</label>
                    <div class="toggle-controls">
                        <label><input type="checkbox" id="expandSlug"> Expand Venue Slug</label>
                        <label><input type="checkbox" id="showTower"> Show Tower</label>
                        <label><input type="checkbox" id="showStrip"> Show Timing Strip</label>
                        <label><input type="checkbox" id="showWeather"> Show Weather</label>
                    </div>
                </div>
                <div class="control-group">
                    <label>Timing Data:</label>
                    <div class="timing-controls">
                        <button id="loadTimingData" class="timing-btn">Load Data (L)</button>
                        <button id="pauseRefresh" class="timing-btn">Pause (P)</button>
                        <button id="resumeRefresh" class="timing-btn">Resume (Q)</button>
                        <span id="timingStatus" class="timing-status">Auto-refresh: OFF</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Weather:</label>
                    <div class="weather-controls">
                        <label><input type="checkbox" id="autoWeather"> Auto Weather</label>
                        <button id="useMyLocation" class="timing-btn">Use My Location</button>
                        <div class="location-inputs">
                            <input type="number" id="latitude" placeholder="Latitude" class="coord-input" step="0.0001">
                            <input type="number" id="longitude" placeholder="Longitude" class="coord-input"
                                step="0.0001">
                        </div>
                        <button id="refreshWeather" class="timing-btn">Refresh Weather</button>
                        <span id="weatherStatus" class="timing-status">Auto weather: OFF</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
