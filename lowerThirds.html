<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Lower Thirds - Speedway Graphics</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="./spx_interface.js"></script>
    <script src="speedway-data-reader.js"></script>
    <script>
        window.SPXGCTemplateDefinition = {
            description: "Lower Thirds Graphics",
            playserver: "OVERLAY",
            playchannel: "1",
            playlayer: "10",
            webplayout: "10",
            out: "manual",
            dataformat: "json",
            uicolor: "4",
            DataFields: [
                {
                    field: "f0",
                    ftype: "dropdown",
                    title:"Position",
                    value: "left",
                    items: [
                        {value: "left", text: "Left Lower Third"},
                        {value: "center", text: "Center Lower Third"},
                        {value: "right", text: "Right Lower Third"}
                    ],
                },
                {
                    field: "f1",
                    ftype: "textfield",
                    title: "Name",
                    value: "JACK HARRISON"
                },
                {
                    field: "f2",
                    ftype: "textfield",
                    title: "Team/Info",
                    value: "SPRINTCAR RACING TEAM"
                }
            ]
        }
        /**
         * SPX COMPANION FUNCTION CALLS
         * 
         * Available companion functions (call these from SPX or console):
         * - window.lowerThirdsAPI.show('left'|'center'|'right')     // Show specific lower third
         * - window.lowerThirdsAPI.hide('left'|'center'|'right')     // Hide specific lower third
         * - window.lowerThirdsAPI.toggle('left'|'center'|'right')   // Toggle specific lower third
         * - window.lowerThirdsAPI.hideAll()                         // Hide all lower thirds
         * - window.lowerThirdsAPI.updateContent(position, data)     // Update content for position
         * - window.loadExcelData()                                  // Manually reload Excel data
         *
         * Keyboard shortcuts:
         * - 1 = Toggle Left Lower Third
         * - 2 = Toggle Center Lower Third  
         * - 3 = Toggle Right Lower Third
         * - ESC = Hide All Lower Thirds
         *
         * Example usages:
         *   window.lowerThirdsAPI.show('left');
         *   window.lowerThirdsAPI.updateContent('center', {name: 'JOHN DOE', team: 'RACING TEAM'});
         *   window.lowerThirdsAPI.hideAll();
         */
    </script>
</head>
<body>
    <div class="lower-thirds-container">
        <!-- Left Lower Third -->
        <div class="lower-third left" id="lowerThirdLeft">
            <div class="lower-third-panel">
                <div class="lower-third-accent"></div>
                <div class="lower-third-content">
                    <div class="lower-third-name" id="leftName">JACK HARRISON</div>
                    <div class="lower-third-info">
                        <div id="leftTeam">SPRINTCAR RACING TEAM</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Center Lower Third -->
        <div class="lower-third center" id="lowerThirdCenter">
            <div class="lower-third-panel">
                <div class="lower-third-accent"></div>
                <div class="lower-third-content">
                    <div class="lower-third-name" id="centerName">SARAH WILLIAMS</div>
                    <div class="lower-third-info">
                        <div id="centerTeam">MIDGET MOTORSPORT</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Lower Third -->
        <div class="lower-third right" id="lowerThirdRight">
            <div class="lower-third-panel">
                <div class="lower-third-accent"></div>
                <div class="lower-third-content">
                    <div class="lower-third-name" id="rightName">MIKE PETERS</div>
                    <div class="lower-third-info">
                        <div id="rightTeam">STREET STOCK RACING</div>
                    </div>
                </div>
            </div>
        </div>
        <span id="f0" style="display:none;">left</span>
        <span id="f1" style="display:none;">JACK HARRISON</span>
        <span id="f2" style="display:none;">SPRINTCAR RACING TEAM</span>
    </div>

    <script>
        // Lower thirds state management
        const lowerThirds = {
            left: {
                element: document.getElementById('lowerThirdLeft'),
                isVisible: false,
                isAnimating: false
            },
            center: {
                element: document.getElementById('lowerThirdCenter'),
                isVisible: false,
                isAnimating: false
            },
            right: {
                element: document.getElementById('lowerThirdRight'),
                isVisible: false,
                isAnimating: false
            }
        };

        // Animate out, called by SPX
        function runAnimationOUT() {
            Object.keys(lowerThirds).forEach(position => {
                const third = lowerThirds[position];
                if (third.isVisible) {
                    third.isAnimating = true;
                    third.element.classList.remove('show');
                    setTimeout(() => {
                        third.isVisible = false;
                        third.isAnimating = false;
                    }, 300);
                }
            });
        }

        // API for external control
        window.lowerThirdsAPI = {
            // Show a specific lower third
            show: async function(position) {
                if (!lowerThirds[position] || lowerThirds[position].isAnimating) return;
                
                // Reload Excel data before showing
                await loadExcelData();
                
                const third = lowerThirds[position];
                third.isAnimating = true;
                third.element.classList.add('show');
                
                // Trigger wipe animation after show animation starts
                setTimeout(() => {
                    third.element.classList.add('wipe');
                }, 100);
                
                setTimeout(() => {
                    third.isVisible = true;
                    third.isAnimating = false;
                }, 800);
                
                console.log(`Lower third ${position} shown with fresh Excel data`);
            },

            // Hide a specific lower third
            hide: async function(position) {
                if (!lowerThirds[position] || lowerThirds[position].isAnimating) return;
                
                const third = lowerThirds[position];
                third.isAnimating = true;
                third.element.classList.remove('wipe');
                
                setTimeout(() => {
                    third.element.classList.remove('show');
                }, 200);
                
                setTimeout(async () => {
                    third.isVisible = false;
                    third.isAnimating = false;
                    
                    // Reload Excel data after hiding for next show
                    await loadExcelData();
                }, 600);
                
                console.log(`Lower third ${position} hidden, Excel data refreshed for next show`);
            },

            // Toggle a specific lower third
            toggle: async function(position) {
                if (!lowerThirds[position]) return;
                
                const third = lowerThirds[position];
                if (third.isVisible) {
                    await this.hide(position);
                } else {
                    await this.show(position);
                }
            },

            // Hide all lower thirds
            hideAll: async function() {
                const hidePromises = Object.keys(lowerThirds).map(position => {
                    if (lowerThirds[position].isVisible) {
                        return this.hide(position);
                    }
                    return Promise.resolve();
                });
                
                await Promise.all(hidePromises);
            },

            // Update content for a specific lower third
            updateContent: function(position, data) {
                if (!lowerThirds[position]) return;

                const nameEl = document.getElementById(`${position}Name`);
                const teamEl = document.getElementById(`${position}Team`);

                if (data.name && nameEl) {
                    nameEl.textContent = data.name.toUpperCase();
                }
                if (data.team && teamEl) {
                    teamEl.textContent = data.team.toUpperCase();
                }

                console.log(`Lower third ${position} content updated`, data);
            }
        };

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case '1':
                    e.preventDefault();
                    window.lowerThirdsAPI.toggle('left');
                    break;
                case '2':
                    e.preventDefault();
                    window.lowerThirdsAPI.toggle('center');
                    break;
                case '3':
                    e.preventDefault();
                    window.lowerThirdsAPI.toggle('right');
                    break;
                case 'Escape':
                    e.preventDefault();
                    window.lowerThirdsAPI.hideAll();
                    break;
            }
        });

        // Excel data integration
        const dataReader = new SpeedwayDataReader();
        
        // Configuration flags
        const csvMode = false; // Set to true to use CSV data instead of Excel
        
        // Function to load Excel data and update lower thirds
        async function loadExcelData() {
            // Skip Excel/CSV loading if csvMode is disabled
            if (!csvMode) {
                console.log('CSV mode disabled, skipping data load');
                return;
            }
            
            try {
                console.log('=== LOADING FRESH EXCEL DATA FOR LOWER THIRDS ===');
                const data = await dataReader.loadExcelData();
                
                if (data && data.lowerThirds) {
                    // Map Excel data to lower thirds
                    // Excel structure: left, centre, right (note: centre vs center)
                    const excelToPosition = {
                        'left': 'left',
                        'centre': 'center', // Map centre to center
                        'center': 'center',
                        'right': 'right'
                    };
                    
                    Object.keys(data.lowerThirds).forEach(excelKey => {
                        const position = excelToPosition[excelKey.toLowerCase()];
                        if (position && data.lowerThirds[excelKey]) {
                            const excelData = data.lowerThirds[excelKey];
                            
                            // Map title to name and subtitle to team
                            const lowerThirdData = {
                                name: excelData.title || 'No Name',
                                team: excelData.subtitle || 'No Team'
                            };
                            
                            window.lowerThirdsAPI.updateContent(position, lowerThirdData);
                            console.log(`✓ Fresh data loaded for ${position}:`, lowerThirdData);
                        }
                    });
                    
                    console.log('=== EXCEL DATA REFRESH COMPLETE ===');
                    
                    // Small delay to ensure DOM updates are applied
                    await new Promise(resolve => setTimeout(resolve, 50));
                } else {
                    console.warn('No lower thirds data found in Excel, using fallback');
                    loadFallbackData();
                }
            } catch (error) {
                console.error('Failed to load Excel data for lower thirds:', error);
                loadFallbackData();
            }
        }
        
        // Fallback data for when Excel loading fails
        function loadFallbackData() {
            const fallbackData = {
                left: { name: 'Excel Error', team: 'Check Excel File' },
                center: { name: 'Excel Error', team: 'Check Excel File' },
                right: { name: 'Excel Error', team: 'Check Excel File' }
            };
            
            Object.keys(fallbackData).forEach(position => {
                window.lowerThirdsAPI.updateContent(position, fallbackData[position]);
            });
        }

        // Initialize
        function init() {
            console.log('Lower Thirds initialized');
            console.log('Keyboard shortcuts:');
            console.log('1 = Toggle Left Lower Third');
            console.log('2 = Toggle Center Lower Third');
            console.log('3 = Toggle Right Lower Third');
            console.log('ESC = Hide All Lower Thirds');
            console.log('API available at window.lowerThirdsAPI');
            
            // Load Excel data
            loadExcelData();
            
            // Set up observers for f1 and f2 changes if CSV mode is disabled
            if (!csvMode) {
                setupSPXDataObservers();
            }
        }
        
        // Set up observers to watch for changes in SPX data fields
        function setupSPXDataObservers() {
            const nameElement = document.getElementById('f1');
            const teamElement = document.getElementById('f2');
            const positionElement = document.getElementById('f0');
            
            if (nameElement || teamElement) {
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.type === 'childList' || mutation.type === 'characterData') {
                            // Get current values
                            const position = positionElement ? positionElement.textContent.trim() : 'left';
                            const name = nameElement ? nameElement.textContent.trim() : '';
                            const team = teamElement ? teamElement.textContent.trim() : '';
                            
                            // Update content if we have valid data
                            if (name && team && lowerThirds[position]) {
                                window.lowerThirdsAPI.updateContent(position, {
                                    name: name,
                                    team: team
                                });
                                console.log(`SPX data changed - Updated ${position}: ${name} - ${team}`);
                            }
                        }
                    });
                });
                
                // Observe both name and team elements for changes
                if (nameElement) {
                    observer.observe(nameElement, { 
                        childList: true, 
                        subtree: true, 
                        characterData: true 
                    });
                }
                if (teamElement) {
                    observer.observe(teamElement, { 
                        childList: true, 
                        subtree: true, 
                        characterData: true 
                    });
                }
                
                console.log('SPX data observers set up for f1 and f2');
            }
        }
        
        // Expose Excel reload function for manual refresh
        window.loadExcelData = loadExcelData;

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            init();
            
            // Add a delay to allow SPX to populate f0/f1/f2 fields (~100ms)
            setTimeout(() => {
                // Get SPX data fields
                const positionElement = document.getElementById('f0');
                const nameElement = document.getElementById('f1');
                const teamElement = document.getElementById('f2');
                
                const position = positionElement ? positionElement.textContent.trim() : 'left';
                const name = nameElement ? nameElement.textContent.trim() : '';
                const team = teamElement ? teamElement.textContent.trim() : '';
                
                // Update content with SPX data if CSV mode is disabled
                if (!csvMode && name && team) {
                    window.lowerThirdsAPI.updateContent(position, {
                        name: name,
                        team: team
                    });
                    console.log(`Updated ${position} with SPX data: ${name} - ${team}`);
                }
                
                // Render the lower third based on SPX data field f0
                if (position && lowerThirds[position]) {
                    console.log(`Rendering ${position} lower third on load`);
                    window.lowerThirdsAPI.show(position);
                } else {
                    console.log('No valid position found, defaulting to left');
                    window.lowerThirdsAPI.show('left');
                }
            }, 150); // 150ms delay to ensure SPX has populated the fields
        });
    </script>
</body>
</html>
