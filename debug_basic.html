<!DOCTYPE html>
<html>
<head>
    <title>Quick Debug Test</title>
</head>
<body>
    <h1>Quick Debug Test</h1>
    <p>Testing basic functionality...</p>
    
    <script>
        console.log('🔧 Debug test starting...');
        
        // Test basic DOM access
        console.log('📄 Document ready:', document.readyState);
        
        // Test key elements exist
        const testElements = [
            'bug', 'tower', 'timingStrip', 'weather', 'controlBar',
            'autoWeather', 'useMyLocation', 'latitude', 'longitude'
        ];
        
        testElements.forEach(id => {
            const element = document.getElementById(id);
            console.log(`🔍 Element '${id}':`, element ? '✅ Found' : '❌ Missing');
        });
        
        // Test geolocation availability
        if (navigator.geolocation) {
            console.log('📍 Geolocation API: ✅ Available');
        } else {
            console.log('📍 Geolocation API: ❌ Not available');
        }
        
        // Test keyboard events
        document.addEventListener('keydown', (event) => {
            console.log('⌨️ Key pressed:', event.key);
        });
        
        console.log('🔧 Debug test complete. Check console for results.');
    </script>
    
    <p>Press F12 to open console and check the results above.</p>
    <p>Try pressing keys like 'b', 't', 's', 'w' to test keyboard shortcuts.</p>
    
    <br><br>
    <a href="/">← Back to main app</a>
</body>
</html>
