<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Championship Points - Motorsport Graphics</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="./spx_interface.js"></script>
    <script>
        window.SPXGCTemplateDefinition = {
            description: "Championship Points Table",
            playserver: "OVERLAY",
            playchannel: "1",
            playlayer: "13",
            webplayout: "13",
            out: "manual",
            dataformat: "json",
            uicolor: "7",
        }
        /**
         * SPX COMPANION FUNCTION CALLS
         * 
         * Available companion functions (call these from SPX or console):
         * - togglePoints()                         // show/hide points table
         * - showPoints()                           // show points with animation
         * - hidePoints()                           // hide points table
         * - loadPointsFromCSV()                    // reload points data from CSV
         * - toggleScroll()                         // scroll between top/bottom if needed
         *
         * Keyboard shortcuts:
         * - SPACE = Toggle Points
         * - ESC = Hide Points
         * - R = Reload CSV Data
         * - S = Toggle Scroll (if more than 15 rows)
         *
         * CSV Format (points.csv):
         * position,number,driver,points
         * 1,17,JACK HARRISON,150
         * 2,5,SARAH WILLIAMS,142
         */
    </script>
</head>
<body>
    <div id="overlay" class="overlay">
        <!-- Points Component -->
        <div id="points" class="points">
            <div class="points-panel">
                <!-- Header -->
                <div class="points-header">
                    <div class="points-logo">
                        <img src="assets/logo.svg" alt="Logo" class="header-logo">
                    </div>
                    <div class="points-title">
                        <span id="pointsTitle">CHAMPIONSHIP STANDINGS</span>
                    </div>
                    <div class="points-info">
                        <span id="pointsInfo">SPRINTCARS</span>
                    </div>
                </div>

                <!-- Column Headers -->
                <div class="points-columns">
                    <div class="points-column-header pos-col">POS</div>
                    <div class="points-column-header number-col">#</div>
                    <div class="points-column-header driver-col">DRIVER</div>
                    <div class="points-column-header heat-col">HT1</div>
                    <div class="points-column-header heat-col">HT2</div>
                    <div class="points-column-header heat-col">HT3</div>
                    <div class="points-column-header subtotal-col">SUBTOTAL</div>
                    <div class="points-column-header heat-col">HEAT 4</div>
                    <div class="points-column-header heat-col">HEAT 5</div>
                    <div class="points-column-header total-col">OVERALL</div>
                </div>

                <!-- Points Rows -->
                <div class="points-rows" id="pointsRows">
                    <!-- Rows will be generated by JavaScript -->
                </div>

                <!-- Hashtag Line -->
                <div class="points-hashtag-line" id="pointsHashtagLine">
                    <span id="pointsHashtag">#SpeedwayNight</span>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Points Component Styles */
        .points {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 65vw;
            max-width: 1300px;
            min-width: 900px;
            z-index: 130;
            opacity: 0;
            transition: all 400ms cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .points.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .points-panel {
            background: var(--bg-900);
            border: 1px solid var(--line);
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            clip-path: polygon(
                0% 0%, 
                calc(100% - 20px) 0%, 
                100% 20px, 
                100% 100%, 
                20px 100%, 
                0% calc(100% - 20px)
            );
        }

        .points-header {
            background: var(--bg-700);
            padding: 24px 32px;
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            align-items: center;
            gap: 24px;
        }

        .points-logo {
            display: flex;
            align-items: center;
        }

        .header-logo {
            height: 72px;
            width: auto;
        }

        .points-title {
            font-weight: 800;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-hi);
            text-align: center;
        }

        .points-info {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-hi);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .points-columns {
            display: grid;
            grid-template-columns: 0.5fr 0.5fr 3fr 0.7fr 0.7fr 0.7fr 0.9fr 0.7fr 0.7fr 1fr;
            background: var(--bg-800);
            border-bottom: 2px solid var(--line);
        }

        .points-column-header {
            padding: 12px 16px;
            font-weight: 700;
            font-size: 15.6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-med);
            border-right: 1px solid var(--line);
            text-align: left;
        }

        .points-column-header:last-child {
            border-right: none;
        }

        .pos-col,
        .number-col,
        .pts-col {
            text-align: center;
        }

        .points-rows {
            max-height: 60vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .points-row {
            display: grid;
            grid-template-columns: 0.5fr 0.5fr 3fr 0.7fr 0.7fr 0.7fr 0.9fr 0.7fr 0.7fr 1fr;
            background: var(--bg-800);
            border-bottom: 1px solid var(--line);
            transition: all 150ms ease-out;
            opacity: 0;
            transform: translateY(-10px);
            position: relative;
            overflow: hidden;
        }

        .points-row.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .points-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Leader styling */
        .points-row.leader {
            background: rgba(255, 215, 0, 0.2) !important;
            border-left: 4px solid #FFD700 !important;
        }

        .points-row.leader .points-cell {
            color: var(--text-hi) !important;
            font-weight: 700 !important;
        }

        /* Top 3 styling */
        .points-row.top3 {
            background: rgba(192, 192, 192, 0.15) !important;
            border-left: 4px solid #C0C0C0 !important;
        }

        .points-row.top3 .points-cell {
            font-weight: 600 !important;
        }

        .points-cell {
            padding: 14px 16px;
            font-size: 18.2px;
            color: var(--text-hi);
            border-right: 1px solid var(--line);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .points-cell:last-child {
            border-right: none;
        }

        .points-cell.pos-cell,
        .points-cell.number-cell,
        .points-cell.heat-cell,
        .points-cell.subtotal-cell,
        .points-cell.total-cell {
            justify-content: center;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .points-cell.pos-cell {
            font-size: 20px;
            font-weight: 800;
        }

        .points-cell.number-cell {
            font-weight: 700;
            background: rgba(255, 255, 255, 0.1);
            margin: 4px;
            border-radius: 4px;
        }

        .points-cell.driver-cell {
            font-weight: 700;
            text-transform: none;
            flex-direction: row;
            align-items: center;
            gap: 0;
        }

        .driver-name {
            font-weight: 800;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            line-height: 1.1;
        }

        .points-cell.heat-cell {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-hi);
        }

        .points-cell.subtotal-cell {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-hi);
            background: rgba(255, 255, 255, 0.05);
        }

        .points-cell.feature-cell {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-hi);
            background: rgba(0, 255, 255, 0.1);
        }

        .points-cell.total-cell {
            font-weight: 800;
            font-size: 18px;
            color: var(--text-hi);
            background: rgba(255, 215, 0, 0.15);
        }

        /* White wipe effect */
        .points-row::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transition: left 600ms ease-out;
            z-index: 2;
        }

        .points-row.wiping::before {
            left: 100%;
        }

        /* Hashtag line */
        .points-hashtag-line {
            background: var(--bg-700);
            padding: 16px 32px;
            border-top: 1px solid var(--line);
            text-align: center;
            transform: translateY(0);
            transition: transform 400ms ease-out, opacity 400ms ease-out;
            opacity: 1;
            position: relative;
            z-index: 10;
        }

        .points-hashtag-line.hidden {
            transform: translateY(100%);
            opacity: 0;
        }

        .points-hashtag-line span {
            font-weight: 700;
            font-size: 20.8px;
            color: var(--text-hi);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Scrollbar styling */
        .points-rows::-webkit-scrollbar {
            width: 6px;
        }

        .points-rows::-webkit-scrollbar-track {
            background: var(--bg-900);
        }

        .points-rows::-webkit-scrollbar-thumb {
            background: var(--line);
        }

        .points-rows::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>

    <script>
        // Animate out, called by SPX
        function runAnimationOUT() {
            const points = document.getElementById('points');
            if (points) {
                points.style.opacity = '0';
            }
            console.log('Points animated out');
        }

        // Application state
        let pointsState = {
            isVisible: false,
            isAnimating: false
        };

        // Points data
        let pointsData = [];

        // Sample fallback data
        const samplePointsData = [
            { position: "1", number: "17", driver: "JACK HARRISON", ht1: "15", ht2: "18", ht3: "20", ht4: "17", ht5: "16" },
            { position: "2", number: "5", driver: "SARAH WILLIAMS", ht1: "18", ht2: "15", ht3: "16", ht4: "15", ht5: "14" },
            { position: "3", number: "41", driver: "MIKE PETERS", ht1: "12", ht2: "20", ht3: "18", ht4: "14", ht5: "13" },
            { position: "4", number: "88", driver: "OLIVIA PARK", ht1: "20", ht2: "12", ht3: "14", ht4: "13", ht5: "12" },
            { position: "5", number: "12", driver: "JORDAN LEE", ht1: "16", ht2: "14", ht3: "15", ht4: "12", ht5: "11" },
            { position: "6", number: "23", driver: "ELLA MOORE", ht1: "14", ht2: "16", ht3: "12", ht4: "11", ht5: "10" },
            { position: "7", number: "9", driver: "LUCAS KENT", ht1: "10", ht2: "10", ht3: "11", ht4: "10", ht5: "9" },
            { position: "8", number: "34", driver: "HUNTER COLE", ht1: "11", ht2: "11", ht3: "10", ht4: "9", ht5: "8" },
            { position: "9", number: "52", driver: "AMELIA BROOKS", ht1: "8", ht2: "9", ht3: "8", ht4: "8", ht5: "7" },
            { position: "10", number: "3", driver: "RYAN TAYLOR", ht1: "9", ht2: "8", ht3: "9", ht4: "7", ht5: "6" }
        ];

        // Event data
        let eventData = {
            title: "Championship Standings",
            info: "Midget Championship",
            hashtag: "#BayparkSpeedway"
        };

        // Query param toggle to force sample data (add ?sample=1)
        const urlParams = new URLSearchParams(window.location.search);
        const forceSampleData = urlParams.has('sample');

        // Load points from CSV
        async function loadPointsFromCSV() {
            if (forceSampleData) {
                console.log('Force sample data enabled via URL param');
                pointsData = [...samplePointsData];
                renderPoints();
                return true;
            }

            try {
                console.log('Loading points from CSV...');
                const response = await fetch('points.csv?' + Date.now());
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        if (results.data && results.data.length > 0) {
                            pointsData = results.data.map((row, index) => {
                                const ht1 = parseInt(row.ht1) || 0;
                                const ht2 = parseInt(row.ht2) || 0;
                                const ht3 = parseInt(row.ht3) || 0;
                                const ht4 = parseInt(row.ht4) || 0;
                                const ht5 = parseInt(row.ht5) || 0;
                                const subtotal = ht1 + ht2 + ht3;
                                const overall = ht1 + ht2 + ht3 + ht4 + ht5;
                                return {
                                    position: row.position || (index + 1).toString(),
                                    number: row.number || '',
                                    driver: (row.driver || '').toUpperCase(),
                                    ht1: ht1.toString(),
                                    ht2: ht2.toString(),
                                    ht3: ht3.toString(),
                                    subtotal: subtotal.toString(),
                                    ht4: ht4.toString(),
                                    ht5: ht5.toString(),
                                    overall: overall.toString()
                                };
                            });
                            
                            console.log('Points loaded from CSV:', pointsData.length, 'entries');
                            renderPoints();
                        } else {
                            console.warn('No data in CSV, using sample data');
                            pointsData = [...samplePointsData];
                            renderPoints();
                        }
                    },
                    error: function(error) {
                        console.error('CSV parse error:', error);
                        pointsData = [...samplePointsData];
                        renderPoints();
                    }
                });
                
                return true;
            } catch (error) {
                console.error('Failed to load points CSV:', error);
                pointsData = [...samplePointsData];
                renderPoints();
                return false;
            }
        }

        // Scroll state
        let scrollState = {
            isAtTop: true,
            totalRows: 0,
            maxVisibleRows: 15
        };

        // Initialize points
        async function init() {
            setupEventListeners();
            await loadPointsFromCSV();
            updateUI();
            console.log('Points display initialized');
            console.log('Keyboard shortcuts: SPACE (toggle), ESC (hide), R (reload CSV)');
        }

        // Update UI elements with current data
        function updateUI() {
            document.getElementById('pointsTitle').textContent = eventData.title;
            document.getElementById('pointsInfo').textContent = eventData.info;
            document.getElementById('pointsHashtag').textContent = eventData.hashtag;
        }

        // Setup event listeners
        function setupEventListeners() {
            document.addEventListener('keydown', handleKeyPress);
        }

        // Handle keyboard shortcuts
        function handleKeyPress(event) {
            const key = event.key.toLowerCase();
            
            switch (key) {
                case ' ':
                    event.preventDefault();
                    togglePoints();
                    break;
                case 'escape':
                    hidePoints();
                    break;
                case 'r':
                    console.log('Reloading points from CSV...');
                    loadPointsFromCSV();
                    break;
            }
        }

        // Toggle points visibility
        function togglePoints() {
            if (pointsState.isAnimating) return;
            
            if (pointsState.isVisible) {
                hidePoints();
            } else {
                showPoints();
            }
        }

        // Show points with animation
        async function showPoints() {
            if (pointsState.isAnimating || pointsState.isVisible) return;
            
            pointsState.isAnimating = true;
            
            // Refresh CSV before showing
            console.log('Refreshing CSV before showing points...');
            await loadPointsFromCSV();
            
            const points = document.getElementById('points');
            const hashtagLine = document.getElementById('pointsHashtagLine');
            
            // Reset all rows to hidden state
            const rows = document.querySelectorAll('.points-row');
            rows.forEach(row => {
                row.classList.remove('revealed', 'wiping');
            });
            
            // Show points container
            points.classList.add('show');
            
            // Wait for container animation
            await sleep(400);
            
            // Hide hashtag line
            hashtagLine.classList.add('hidden');
            
            // Wait for hashtag to hide
            await sleep(200);
            
            // Reveal rows one by one with wipe effect
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                
                // Start wipe effect
                row.classList.add('wiping');
                
                // Reveal row after short delay
                setTimeout(() => {
                    row.classList.add('revealed');
                }, 100);
                
                // Wait between rows (shorter delay for leader)
                await sleep(i === 0 ? 150 : 80);
            }
            
            pointsState.isVisible = true;
            pointsState.isAnimating = false;
            
            console.log('Points opened');
        }

        // Hide points
        async function hidePoints() {
            if (pointsState.isAnimating || !pointsState.isVisible) return;
            
            pointsState.isAnimating = true;
            const points = document.getElementById('points');
            const hashtagLine = document.getElementById('pointsHashtagLine');
            
            // Show hashtag line
            hashtagLine.classList.remove('hidden');
            
            // Hide points container
            points.classList.remove('show');
            
            // Wait for animation
            await sleep(400);
            
            // Refresh CSV after hiding for next time
            console.log('Refreshing CSV after hiding points...');
            loadPointsFromCSV();
            
            pointsState.isVisible = false;
            pointsState.isAnimating = false;
            
            console.log('Points closed');
        }

        // Render points rows
        function renderPoints() {
            const container = document.getElementById('pointsRows');
            container.innerHTML = '';

            // Render data rows
            pointsData.forEach((item, index) => {
                const row = createPointsRow(item, index);
                container.appendChild(row);
            });

            // Update scroll state
            updateScrollState();
        }

        // Create points row element
        function createPointsRow(data, index) {
            const row = document.createElement('div');
            row.className = 'points-row';
            
            // Add special styling based on position
            if (index === 0) {
                row.classList.add('leader');
            } else if (index < 3) {
                row.classList.add('top3');
            }

            // Calculate subtotal and total
            const ht1 = parseInt(data.ht1) || 0;
            const ht2 = parseInt(data.ht2) || 0;
            const ht3 = parseInt(data.ht3) || 0;
            const ht4 = parseInt(data.ht4) || 0;
            const ht5 = parseInt(data.ht5) || 0;
            const subtotal = data.subtotal || (ht1 + ht2 + ht3).toString();
            const overall = data.overall || (ht1 + ht2 + ht3 + ht4 + ht5).toString();

            row.innerHTML = `
                <div class="points-cell pos-cell">${data.position}</div>
                <div class="points-cell number-cell">${data.number}</div>
                <div class="points-cell driver-cell">
                    <div class="driver-name">${data.driver}</div>
                </div>
                <div class="points-cell heat-cell">${data.ht1 || '0'}</div>
                <div class="points-cell heat-cell">${data.ht2 || '0'}</div>
                <div class="points-cell heat-cell">${data.ht3 || '0'}</div>
                <div class="points-cell subtotal-cell">${subtotal}</div>
                <div class="points-cell heat-cell">${data.ht4 || '0'}</div>
                <div class="points-cell heat-cell">${data.ht5 || '0'}</div>
                <div class="points-cell total-cell">${overall}</div>
            `;

            return row;
        }

        // Update scroll state 
        function updateScrollState() {
            scrollState.totalRows = pointsData.length;
            scrollState.isAtTop = true;
        }

        // Handle scroll toggle
        function toggleScroll() {
            const pointsRows = document.getElementById('pointsRows');
            
            if (scrollState.totalRows <= scrollState.maxVisibleRows) {
                return;
            }
            
            if (scrollState.isAtTop) {
                pointsRows.scrollTo({
                    top: pointsRows.scrollHeight,
                    behavior: 'smooth'
                });
                scrollState.isAtTop = false;
            } else {
                pointsRows.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
                scrollState.isAtTop = true;
            }
        }

        // Utility function for delays
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            init();
            
            // Show points automatically on page load
            setTimeout(() => {
                showPoints();
            }, 300);
            
            // Add keyboard shortcut for scrolling
            document.addEventListener('keydown', function(event) {
                if (event.key.toLowerCase() === 's' && scrollState.totalRows > scrollState.maxVisibleRows) {
                    event.preventDefault();
                    toggleScroll();
                }
            });
        });
    </script>
</body>
</html>
