<!DOCTYPE html>
<html>
<head>
    <title>Weather API Debug Test</title>
</head>
<body>
    <h1>Weather API Debug Test</h1>
    <div id="output"></div>
    
    <script>
        const API_KEY = "b3d099c80c975b69d647e14b7e9475d3";
        const output = document.getElementById('output');
        
        function log(message) {
            console.log(message);
            output.innerHTML += `<p>${message}</p>`;
        }
        
        async function testIPGeolocation() {
            try {
                log("Testing IP geolocation...");
                const response = await fetch('https://ipapi.co/json/');
                
                log(`IP API Response Status: ${response.status} ${response.statusText}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`IP API Response: ${JSON.stringify(data, null, 2)}`);
                
                if (data.error) {
                    throw new Error(data.reason || 'IP geolocation failed');
                }
                
                return {
                    latitude: data.latitude,
                    longitude: data.longitude,
                    city: data.city,
                    country: data.country_name
                };
            } catch (error) {
                log(`IP Geolocation Error: ${error.message}`);
                throw error;
            }
        }
        
        async function testWeatherAPI(lat, lon) {
            try {
                log(`Testing weather API for coordinates: ${lat}, ${lon}`);
                const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`;
                log(`Weather API URL: ${url}`);
                
                const response = await fetch(url);
                
                log(`Weather API Response Status: ${response.status} ${response.statusText}`);
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Invalid API key');
                    } else if (response.status === 429) {
                        throw new Error('API rate limit exceeded');
                    } else {
                        const errorText = await response.text();
                        log(`Weather API Error Response: ${errorText}`);
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                }
                
                const data = await response.json();
                log(`Weather API Response: ${JSON.stringify(data, null, 2)}`);
                
                return data;
            } catch (error) {
                log(`Weather API Error: ${error.message}`);
                throw error;
            }
        }
        
        async function runTest() {
            try {
                // Test IP geolocation
                const location = await testIPGeolocation();
                log(`✅ IP Geolocation successful: ${location.city}, ${location.country}`);
                
                // Test weather API
                const weatherData = await testWeatherAPI(location.latitude, location.longitude);
                log(`✅ Weather API successful: ${weatherData.weather[0].main}, ${Math.round(weatherData.main.temp)}°C`);
                
                log("🎉 All tests passed!");
                
            } catch (error) {
                log(`❌ Test failed: ${error.message}`);
            }
        }
        
        // Run test automatically
        runTest();
    </script>
</body>
</html>
